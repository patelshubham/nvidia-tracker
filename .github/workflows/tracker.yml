name: nvda-tracker

on:
  # The cron schedule is disabled: GitHub ran 2 of ~140 expected runs in 24h, so alerts arrived
  # after the move. The PC watcher (scripts/install_task.ps1) is the primary runner now.
  # To re-enable, add back:
  #   schedule:
  #     - cron: "7-59/10 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Open a test issue to confirm alerts reach you"
        type: boolean
        default: false

concurrency:
  group: tracker
  cancel-in-progress: false

permissions:
  contents: write   # append the delay log to the `telemetry` branch
  issues: write     # open an issue per alert batch (GitHub then emails/pushes the owner)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stamp start time (before anything slow, to measure scheduler delay)
        id: stamp
        run: echo "t=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Restore alert de-duplication state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Send test alert
        if: ${{ inputs.send_test }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVDA_TOAST: "0"
        run: python -m nvda_tracker test-notify

      - name: Run tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVDA_TOAST: "0"
        run: python -m nvda_tracker check

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: state-${{ github.run_id }}

      - name: Log scheduler delay (trial measurement)
        if: always()
        env:
          T: ${{ steps.stamp.outputs.t }}
          EVENT: ${{ github.event_name }}
        run: |
          # Latest :07/:17/... slot at or before the start time. Delays > 10 min alias to a later
          # slot, so also look at gaps between consecutive rows (a gap >> 600s means missed runs).
          slot=$(( (T - 420) / 600 * 600 + 420 ))
          delay=$(( T - slot ))
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin telemetry || true
          if git rev-parse --verify -q origin/telemetry >/dev/null; then
            git worktree add -B telemetry ../tel origin/telemetry
          else
            git worktree add --orphan -b telemetry ../tel
            echo "start_utc,epoch,event,delay_s" > ../tel/delays.csv
          fi
          echo "$(date -u -d @"$T" +%FT%TZ),$T,$EVENT,$delay" >> ../tel/delays.csv
          cd ../tel && git add delays.csv && git commit -qm "delay $delay s" && git push origin telemetry
